[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stixflow"
version = "0.1.0"
description = "STIX 2.1 / TAXII 2.1 threat-intel pipeline with an ICS/OT focus: collect, store, pivot, hunt, report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chris" }]
keywords = ["stix", "taxii", "threat-intelligence", "cti", "ics", "ot-security", "mitre-attack"]
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stixflow = "stixflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stixflow = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["stixflow", "conftest"]
